groups:
  - name: ecom-app-availability
    rules:
      - alert: AppInstanceDown
        expr: up{job="ecom-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Production app is DOWN"
          description: "Prometheus cannot scrape {{ $labels.instance }} for over 1 minute."

  - name: ecom-app-performance
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(ecom_http_request_duration_seconds_count{status_code=~"5.."}[5m]))
            /
          sum(rate(ecom_http_request_duration_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx error rate (>5%)"
          description: "More than 5% of requests are failing over the last 5 minutes."

      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(ecom_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s"
          description: "95th percentile request latency has exceeded 1 second for 2 minutes."

  - name: vm-host
    rules:
      - alert: HighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on CI/CD VM"
          description: "CPU usage above 85% for 5 minutes on {{ $labels.instance }}."
